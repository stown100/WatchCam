name: WatchCam

options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES

packages:
  SyncKit:
    path: SyncKit

targets:
  WatchCam:
    type: application
    platform: iOS
    sources:
      - path: iOS
      - path: Shared
    dependencies:
      - target: WatchCamWatch
      - package: SyncKit
    info:
      path: iOS/Info.plist
      properties:
        CFBundleDisplayName: WatchCam
        CFBundleDevelopmentRegion: ru
        UILaunchScreen:
          UIColorName: ""
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        NSCameraUsageDescription: "WatchCam снимает видео камерой iPhone."
        NSMicrophoneUsageDescription: "Микрофон iPhone записывает опорную дорожку для точной синхронизации со звуком с часов и запасной звук, если файл с часов не придёт."
        NSPhotoLibraryAddUsageDescription: "WatchCam сохраняет готовые ролики в вашу медиатеку."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchcam
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO

  WatchCamWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: WatchCam
        CFBundleDevelopmentRegion: ru
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(BUNDLE_ID_PREFIX).watchcam
        WKRunsIndependentlyOfCompanionApp: false
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "Микрофон часов записывает ваш голос для видео, которое снимает iPhone."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).watchcam.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES

schemes:
  WatchCam:
    build:
      targets:
        WatchCam: all
        WatchCamWatch: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: SyncKit/SyncKitTests
    archive:
      config: Release

  WatchCamWatch:
    build:
      targets:
        WatchCamWatch: all
    run:
      config: Debug
    archive:
      config: Release
